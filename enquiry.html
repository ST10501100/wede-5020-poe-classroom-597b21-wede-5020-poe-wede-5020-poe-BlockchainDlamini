<section class="enquiry">
    <h2>Enquire About Other Products</h2>
    <p>Looking for something special? Send us a message and we’ll get back to you on WhatsApp.</p>

    <form onsubmit="sendEnquiry(); return false;">

        <input type="text" id="name" placeholder="Your Name" required><br>

        <input type="tel" id="phone" placeholder="Your Phone Number" required><br>

        <textarea id="message" placeholder="What would you like to enquire about?" required></textarea><br>

    </form>
</section>

 <!-- SCRIPT (IMPORTANT: must be before closing body) -->
<script>
function sendEnquiry() 

    var name = document.getElementById("name").value;
    var phone = document.getElementById("phone").value;
    var message = document.getElementById("message").value;

    var whatsappMessage =
        "New Enquiry from Beez Bakery:%0A" +
        "Name: " + name + "%0A" +
        "Phone: " + phone + "%0A" +
        "Enquiry: " + message;

    var url = "https://wa.me/27764233543?text=" + whatsappMessage;

    window.open(url, "_blank");
